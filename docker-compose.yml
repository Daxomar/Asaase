services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: asaase
      POSTGRES_USER: asaase
      POSTGRES_PASSWORD: asaase
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asaase -d asaase"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
